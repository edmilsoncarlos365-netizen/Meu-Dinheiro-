<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0a1929">
<title>Meu Dinheiro 💰</title>
<style>
/* =====================================================================
   SISTEMA VISUAL ÚNICO — Meu Dinheiro
   Todas as páginas, janelas e componentes usam apenas estas regras.
   ===================================================================== */
:root{
  --bg:#0a1929;          /* fundo azul-marinho */
  --card:#112540;        /* cartões */
  --card2:#0f2b4c;       /* cartão de gráfico */
  --line:#1e3a5d;        /* bordas discretas */
  --input:#0a1a2c;
  --text:#ffffff;
  --muted:#8fa3b8;       /* texto secundário azul-acinzentado */
  --green:#22a06b;--green2:#35d19a;--greenbg:#16392f;
  --red:#d64545;--red2:#f06f6f;--redbg:#44202a;
  --yellow:#f2c14e;--yellowbg:#43381a;
  --blue:#8ab4f8;--bluebg:#1b3556;
  --chip:#233f5f;--purple:#a78bfa;--purplebg:#2c2556;--blue2:#5aa2ff;
  --r:16px;--r2:12px;
  --sh:0 4px 14px rgba(0,0,0,.25);
  --gap:12px;--pad:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-behavior:auto}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Roboto,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;font-size:14px;line-height:1.35;color-scheme:dark}
body{min-height:100vh;overflow-x:hidden}
h1,h2,h3,h4,p{margin:0}
button{font-family:inherit;cursor:pointer}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:78px}

/* ---- tipografia ---- */
.muted{color:var(--muted)}
.green{color:var(--green)}.red{color:var(--red)}.gtxt{color:var(--green2)}.rtxt{color:var(--red2)}
.xs{font-size:12px}
.note{color:var(--muted);font-size:12.5px;margin-top:8px;line-height:1.4}
  const f=ACT[t.dataset.act]; if(f) f(t.dataset,t);
});
document.addEventListener('input',e=>{
  const t=e.target; if(!t.dataset||!t.dataset.chg) return;
  if(t.dataset.chg==='cvv'){ cv.v=t.value; $('#cv_res').innerHTML=convHtml(); }
  else if(t.dataset.chg==='rcalc') recalcNext();
});
document.addEventListener('change',e=>{
  const t=e.target; if(!t.dataset||!t.dataset.chg) return; const c=t.dataset.chg;
  if(c==='day'){ F[t.dataset.k+'Day']=t.value||today(); $('#list_'+t.dataset.k).innerHTML=recList(t.dataset.k); }
  else if(c==='cvf'){ cv.from=t.value; $('#cv_res').innerHTML=convHtml(); }
  else if(c==='cvt'){ cv.to=t.value; $('#cv_res').innerHTML=convHtml(); }
  else if(c==='rcalc') recalcNext();
});

/* ===================== Bloqueio por PIN ===================== */
function lockRender(){
  $('#lock').innerHTML=`<div style="font-size:40px">💰</div><h2>Meu Dinheiro</h2><div class="muted">Introduza o PIN</div><div class="dots" id="dots">${[0,1,2,3].map(i=>`<i class="${i<pinBuf.length?'f':''}"></i>`).join('')}</div>
  <div class="pad3">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button data-pk="${k}">${k}</button>`).join('')}</div>`;
}
function lockShow(){ pinBuf=''; $('#lock').classList.add('on'); lockRender(); }
$('#lock').addEventListener('click',e=>{
  const b=e.target.closest('[data-pk]'); if(!b) return; const k=b.dataset.pk;
  if(k==='⌫') pinBuf=pinBuf.slice(0,-1); else if(pinBuf.length<4) pinBuf+=k;
  lockRender();
  if(pinBuf.length===4){
    if(pinBuf===S.settings.pin){ $('#lock').classList.remove('on'); pinBuf=''; }
    else { $('#dots').classList.add('shake'); setTimeout(()=>{ pinBuf=''; lockRender(); },350); }
  }
});

/* ===================== Início ===================== */
render();
if(S.settings.pin) lockShow();
checkNotify();
setInterval(checkNotify,60000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) checkNotify(); });
</script>
</body>
</html>
